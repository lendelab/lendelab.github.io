name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.170.0
  HUGO_SHA256: 0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record each member's last change
        run: |
          for f in data/members/*.yaml; do
            s=$(basename "$f" .yaml)
            d=$(git log -1 --format=%cs -- "$f" "data/publications/extra/$s.yaml" "data/orcid/$s.json")
            if [ -n "$d" ]; then echo "$s: $d"; fi
          done > data/updated.yaml

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the layout check's browsers
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium firefox webkit

      - name: Layout check
        run: python tests/check.py public

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
