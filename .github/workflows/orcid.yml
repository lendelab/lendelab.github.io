name: ORCID

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.170.0
  HUGO_SHA256: 0930754ec22ad2dd1a252f8c31a5e57faccc9d15f1c3d381ddafcb96eeb8aef0

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python -m pip install --requirement scripts/requirements.txt

      - name: Fetch ORCID works
        env:
          ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
        run: python scripts/orcid_fetch.py

      - name: Validate publication data
        run: python scripts/validate_publications.py

      - name: Commit changed ORCID files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/orcid
          if ! git diff --cached --quiet; then
            git commit -m "Update ORCID data"
            git push origin "HEAD:${GITHUB_REF_NAME}" || {
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install Hugo
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/hugo.tar.gz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.fetch.outputs.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Record each member's last change
        run: |
          for f in data/members/*.yaml; do
            s=$(basename "$f" .yaml)
            d=$(git log -1 --format=%cs -- "$f" "data/publications/extra/$s.yaml" "data/orcid/$s.json")
            if [ -n "$d" ]; then echo "$s: $d"; fi
          done > data/updated.yaml

      - name: Build
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  candidates:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.fetch.outputs.sha }}
          fetch-depth: 0

      - name: Leave the branch alone if a person has edited it
        id: branch
        run: |
          skip=false
          if git rev-parse --verify --quiet origin/propuestas-publicaciones >/dev/null; then
            authors=$(git log --format='%an' "origin/${GITHUB_REF_NAME}..origin/propuestas-publicaciones" | sort -u)
            if [ -n "$authors" ] && printf '%s\n' "$authors" | grep -qv '^github-actions\[bot\]$'; then
              skip=true
              echo "::notice::propuestas-publicaciones has commits by a person; not rebuilt this week"
            fi
          fi
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.branch.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Propose works for the group list
        if: steps.branch.outputs.skip == 'false'
        run: |
          python -m pip install --requirement scripts/requirements.txt
          python scripts/orcid_candidates.py --append-to-group --body "${RUNNER_TEMP}/body.md"
          python scripts/validate_publications.py

      - name: Open or update the pull request
        if: steps.branch.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: propuestas-publicaciones
          base: ${{ github.ref_name }}
          add-paths: data/publications/group.yaml
          commit-message: Propose works for the group list
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          title: Publication proposals for the group list
          body-path: ${{ runner.temp }}/body.md
          delete-branch: true
