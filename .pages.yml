  - name: url_label_en
    label: Texto del enlace (en); si se deja vacío, «Website»
    type: string
  - name: more_urls
    label: Otras webs
    type: object
    list: true
    fields:
    - name: url
      label: Enlace
      type: string
    - name: label_es
      label: Texto del enlace (es)
      type: string
    - name: label_en
      label: Texto del enlace (en)
      type: string
  - name: text_es
    label: Texto (es)
    type: rich-text
    options:
      format: markdown
  - name: text_en
    label: Texto (en)
    type: rich-text
    options:
      format: markdown
- name: outreach
  label: Divulgación
  type: collection
  path: data/outreach
  format: yaml
  filename: '{fields.date}-{primary}.yaml'
  view:
    fields:
    - title
    - date
    - type_es
    primary: title
    default:
      sort: date
      order: desc
  fields:
  - name: date
    label: 'Fecha (año sin día ni mes, el 31 de diciembre)'
    type: date
    required: true
  - name: date_precision
    label: Precisión de la fecha
    type: select
    options:
      values:
      - day
      - month
      - year
  - name: date_label_es
    label: Fecha tal como se muestra (es)
    type: string
  - name: date_label_en
    label: Fecha tal como se muestra (en)
    type: string
  - name: upcoming
    label: Próximamente
    type: boolean
  - name: type_es
    label: Tipo (es)
    type: string
  - name: type_en
    label: Tipo (en)
    type: string
  - name: title
    label: Título
    type: string
    required: true
  - name: venue
    label: Lugar o medio (es)
    type: string
  - name: venue_en
    label: Lugar o medio (en)
    type: string
  - name: people
    label: 'Participantes (identificador si es miembro; si no, nombre)'
    type: string
    list: true
  - name: people_note_es
    label: Texto tras los participantes (es), p. ej. «con …» o «(docente)»
    type: string
  - name: people_note_en
    label: Texto tras los participantes (en)
    type: string
  - name: people_and
    label: Unir el último participante con «y»
    type: boolean
  - name: url
    label: Enlace
    type: string
  - name: source_es
    label: Fuente del enlace (es), p. ej. «La Gaceta de Salamanca»
    type: string
  - name: source_en
    label: Fuente del enlace (en)
    type: string
  - name: text_es
    label: Descripción (es)
    type: rich-text
    options:
      format: markdown
  - name: text_en
    label: Descripción (en)
    type: rich-text
    options:
      format: markdown
  - name: sessions
    label: Sesiones
    type: object
    list: true
    fields:
    - name: date
      label: Fecha
      type: date
    - name: title
      label: Título o lugar
      type: string
    - name: person
      label: Persona (identificador si es miembro)
      type: string
