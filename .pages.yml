  - name: title_es
    label: Título (es)
    type: string
    required: true
  - name: title_en
    label: Título (en)
    type: string
  - name: text_es
    label: Texto (es)
    type: rich-text
    options:
      format: markdown
  - name: text_en
    label: Texto (en)
    type: rich-text
    options:
      format: markdown
  - name: fields
    label: Datos
    type: object
    list: true
    fields:
    - name: label_es
      label: Etiqueta (es)
      type: string
    - name: label_en
      label: Etiqueta (en)
      type: string
    - name: value
      label: Valor
      type: string
    - name: value_en
      label: Valor (en)
      type: string
    - name: url
      label: Enlace
      type: string
  - name: cite
    label: Cómo citar (es)
    type: text
  - name: cite_en
    label: Cómo citar (en)
    type: text
- name: collaborations
  label: Colaboraciones
  type: file
  path: data/collaborations.yaml
  format: yaml
  list: true
