  text_es: |-
    Centro de Referencia Estatal de Atención a Personas con Enfermedad de Alzheimer y otras Demencias.

    El CRE Alzheimer colaboró en la investigación de la que procede el Corpus Quijote y coordinó en 2025 el curso en línea «Alteraciones del lenguaje y dificultades de comunicación en demencia», impartido por Olga Ivanova. En 2026, el blog del centro publicó un artículo divulgativo de Jordi Just Alcaraz y Olga Ivanova sobre el diagnóstico diferencial de la enfermedad de Alzheimer y la depresión mayor a partir del habla.
  text_en: |-
    Centro de Referencia Estatal de Atención a Personas con Enfermedad de Alzheimer y otras Demencias [State Reference Center for the Care of People with Alzheimer’s Disease and Other Dementias].

    The CRE Alzheimer collaborated on the research from which the Corpus Quijote derives, and in 2025 it coordinated the online course “Alteraciones del lenguaje y dificultades de comunicación en demencia”, taught by Olga Ivanova. In 2026 the center’s blog published an article for the general public by Jordi Just Alcaraz and Olga Ivanova on the differential diagnosis of Alzheimer’s disease and major depression from speech.
- name: Instituto de Neurociencias de Castilla y León (INCYL) y grupo Neurofisiología, Cognición y Conducta
  name_en: Instituto de Neurociencias de Castilla y León (INCYL) and the Neurofisiología, Cognición y Conducta group
  url: https://institutoneurociencias.org/
  more_urls: []
  text_es: LendeLab colabora con el grupo de investigación Neurofisiología, Cognición y Conducta del INCYL, dirigido
    por Juan José García Meilán. La colaboración comprende el proyecto DEMEALEN, del que García Meilán es investigador
    principal, la codirección de tres tesis doctorales de LendeLab y el Corpus Quijote, que procede del trabajo
    conjunto con este equipo.
  text_en: LendeLab collaborates with the INCYL research group Neurofisiología, Cognición y Conducta, led by Juan
    José García Meilán. The collaboration covers the DEMEALEN project, of which García Meilán is principal investigator;
    the co-supervision of three LendeLab doctoral theses; and the Corpus Quijote, which came out of joint work with
    this team.
- name: Université de Lille, laboratorio Savoirs, Textes, Langage (UMR 8163 STL)
