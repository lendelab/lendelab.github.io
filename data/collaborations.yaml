  - url: https://stl.univ-lille.fr/
    label_es: Laboratorio STL
    label_en: STL laboratory
  text_es: Montserrat Rangel Vicente, <span lang="fr">maîtresse de conférences</span> de lingüística española en
    la Université de Lille y miembro del laboratorio Savoirs, Textes, Langage (UMR 8163, CNRS), es investigadora
    asociada de LendeLab y estudia si los topónimos pueden servir como marcadores de la progresión de la enfermedad
    de Alzheimer. En mayo de 2025, durante una estancia de investigación en la Universidad de Salamanca, presentó
    en el seminario del grupo su trabajo sobre el tratamiento cognitivo de los topónimos.
  text_en: Montserrat Rangel Vicente, <span lang="fr">maîtresse de conférences</span> in Spanish linguistics at
    the Université de Lille and a member of the Savoirs, Textes, Langage laboratory (UMR 8163, CNRS), is an associate
    researcher of LendeLab and studies whether toponyms can serve as markers of the progression of Alzheimer’s disease.
    In May 2025, during a research stay at the Universidad de Salamanca, she presented her work on the cognitive
    processing of toponyms at the group’s seminar.
- name: Universität Heidelberg
  name_en: ''
  url: https://www.uni-heidelberg.de/
  more_urls: []
  text_es: 'Olga Ivanova ha impartido docencia en la Universität Heidelberg y ha realizado varias estancias de investigación
    en el grupo de Óscar Loureda, con ayudas de los programas Santander Universidades, DAAD y José Castillejo. Dos
    obras colectivas coordinadas por Loureda incluyen capítulos de miembros de LendeLab: el *Manual de lingüística
    del hablar* (2021) y el volumen de próxima publicación *Métodos experimentales para la lingüística hispánica*.'
  text_en: 'Olga Ivanova has taught at the Universität Heidelberg and has made several research stays in Óscar Loureda’s
    group, funded by the Santander Universidades, DAAD and José Castillejo programs. Two collective volumes edited
    by Loureda include chapters by LendeLab members: the *Manual de lingüística del hablar* (2021) and the forthcoming
    *Métodos experimentales para la lingüística hispánica*.'
