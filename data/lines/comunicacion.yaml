title_es: Comunicación e intervención
title_en: Communication and intervention
text_es: Las alteraciones del lenguaje propias de las demencias afectan a la comunicación diaria con quienes las
  padecen. Para profesionales, cuidadores y personas interesadas se impartió en 2025, con el CRE Alzheimer, el curso
  en línea «Alteraciones del lenguaje y dificultades de comunicación en demencia»; en 2026 se publicó el catálogo
  divulgativo «Palabras que cuidan», con los resultados de un estudio cualitativo. También se han evaluado el alcance,
  la precisión y el apoyo comunicativo de las respuestas de ChatGPT a cuidadores de personas con demencia. En el
  terreno de la intervención, una tesis doctoral estudia la enseñanza de idiomas a personas mayores como factor
  de desarrollo de la reserva cognitiva.
text_en: The language impairments characteristic of the dementias affect everyday communication with the people
  who have them. In 2025 the online course “Alteraciones del lenguaje y dificultades de comunicación en demencia”,
  intended for professionals, caregivers and anyone interested, was taught in collaboration with the CRE Alzheimer;
  “Palabras que cuidan”, a catalog for the general public presenting the results of a qualitative study, was published
  in 2026. ChatGPT’s answers to caregivers of people with dementia have also been evaluated for their scope, their
  accuracy and the communicative support they offer. In the area of intervention, a doctoral thesis studies the
  teaching of foreign languages to older adults as a factor in the development of cognitive reserve.
