slug: diagnostico-diferencial
order: 2
title_es: Diagnóstico diferencial a partir del habla
title_en: Differential diagnosis from speech
text_es: En la vejez, los síntomas depresivos pueden deberse a una depresión mayor o formar parte de la fase preclínica
  de la enfermedad de Alzheimer. Distinguir los dos cuadros a partir del habla fue el objetivo del proyecto DEMEALEN,
  en el que ha participado el grupo. Se comparan grabaciones de personas mayores sanas, con depresión mayor y con
  enfermedad de Alzheimer, en las que se analizan el habla emocional, la complejidad sintáctica y el efecto de la
  ansiedad y la depresión en la modulación del habla. El ritmo y la frecuencia fundamental se estudian como posibles
  biomarcadores fonéticos de cada cuadro y en relación con la organización cerebral de la prosodia.
text_en: In later life, depressive symptoms may be due to major depression or may belong to the preclinical phase
  of Alzheimer’s disease. Telling the two conditions apart from speech was the aim of DEMEALEN, a project in which
  the group has taken part. Recordings of healthy older adults are compared with recordings of older adults with
  major depression and with Alzheimer’s disease; the analysis covers emotional speech, syntactic complexity and
  the effect of anxiety and depression on the modulation of speech. Rhythm and fundamental frequency are studied
  as possible phonetic biomarkers of each condition and in relation to the cerebral organization of prosody.
topics_es:
- Habla emocional en la depresión mayor y en la fase preclínica de la enfermedad de Alzheimer
- Ritmo y frecuencia fundamental como biomarcadores fonéticos de la enfermedad de Alzheimer y de la depresión mayor
- Organización cerebral de la prosodia en la enfermedad de Alzheimer y en la depresión mayor
- Complejidad sintáctica en hablantes mayores sanos, con depresión mayor y con enfermedad de Alzheimer
- Efecto de la ansiedad y de la depresión en la modulación del habla
topics_en:
- Emotional speech in major depression and in the preclinical phase of Alzheimer’s disease
- Rhythm and fundamental frequency as phonetic biomarkers of Alzheimer’s disease and of major depression
- Cerebral organization of prosody in Alzheimer’s disease and in major depression
- Syntactic complexity in healthy older speakers and in older speakers with major depression or with Alzheimer’s
  disease
- The effect of anxiety and depression on speech modulation
