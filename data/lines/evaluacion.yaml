title_es: Evaluación del lenguaje en la demencia
title_en: Language assessment in dementia
text_es: Saber qué capacidades lingüísticas conserva una persona con demencia y cuáles ha perdido exige instrumentos
  de evaluación adaptados a esa población. La competencia pragmática, que permite usar el lenguaje de manera adecuada
  en cada situación comunicativa, plantea en las enfermedades neurodegenerativas retos teóricos y metodológicos
  propios. Se han analizado esos retos y se han revisado de forma crítica los instrumentos de medida pragmática
  disponibles, con vistas a adaptarlos a las personas con demencia. A partir del discurso de pacientes con enfermedad
  de Alzheimer se comparan distintos enfoques de análisis del lenguaje para elaborar protocolos de evaluación, entre
  ellos uno específico para la competencia sintáctica.
text_en: Knowing which linguistic abilities a person with dementia retains and which they have lost requires assessment
  instruments adapted to that population. Pragmatic competence, which allows language to be used appropriately in
  each communicative situation, poses theoretical and methodological challenges of its own in neurodegenerative
  diseases. These challenges have been analyzed, and the available instruments for measuring pragmatic competence
  have been critically reviewed with a view to adapting them for people with dementia. Using discourse from patients
  with Alzheimer’s disease, the work compares different approaches to language analysis in order to develop assessment
  protocols, including one specifically for syntactic competence.
