bio_es: 'Ariadna Vergés Bonaventura es investigadora predoctoral en el Departamento de Lengua Española de la Universidad
  de Salamanca, donde colabora en la docencia del Grado en Estudios Ingleses. En su tesis doctoral estudia la enseñanza
  de idiomas a personas mayores como factor de desarrollo de la reserva cognitiva. Los primeros trabajos que presentó
  se ocupaban ya de las personas mayores: en ellos estudió cómo se altera el componente léxico-semántico en el envejecimiento
  sano y patológico. Se graduó en Filología Hispánica (2024) y obtuvo el Máster en Enseñanza del Español como Lengua
  Extranjera (2025) en la Universidad de Salamanca, en ambos casos con premio extraordinario.'
bio_en: Ariadna Vergés Bonaventura holds a predoctoral position in the Department of Spanish Language at the Universidad
  de Salamanca, where she contributes to teaching on the degree in English Studies. Her thesis looks at the teaching
  of foreign languages to older adults as a factor in the development of cognitive reserve. Older adults were already
  the subject of the first work she presented, which examined how the lexical-semantic component is altered in healthy
  and pathological aging. She received the Premio Extraordinario, the university’s award for an outstanding academic record, for both her BA in Hispanic Philology (2024) and her MA in Teaching Spanish as a Foreign Language (2025)
  at the Universidad de Salamanca.
