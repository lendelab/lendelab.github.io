bio_es: Elena García Piñuela es investigadora predoctoral en el Departamento de Lengua Española de la Universidad
  de Salamanca, donde colabora en la docencia de los grados en Antropología y en Filología Hispánica. En su tesis
  doctoral estudia la producción sintáctica en la enfermedad de Alzheimer. La sintaxis es también el objeto de los
  trabajos que ha presentado hasta ahora, dedicados a la complejidad sintáctica en el envejecimiento sano, en la
  enfermedad de Alzheimer y en la depresión mayor. Se graduó en Filología Hispánica en la Universidad de Salamanca
  (2023) con premio extraordinario y cursó después el Máster en Formación del Profesorado.
bio_en: Elena García Piñuela is a predoctoral researcher in the Department of Spanish Language at the Universidad
  de Salamanca, where she contributes to teaching on the degrees in Anthropology and Hispanic Philology. Her doctoral
  thesis examines syntactic production in Alzheimer’s disease. The work she has presented so far is also on syntax,
  specifically on syntactic complexity in healthy aging, in Alzheimer’s disease and in major depression. She graduated
  in Hispanic Philology from the Universidad de Salamanca in 2023 with the Premio Extraordinario, the university’s award for an outstanding academic record, and then took the Master’s in Teacher Training.
