bio_es: Emma Machado de Souza es investigadora predoctoral en el Departamento de Lengua Española de la Universidad
  de Salamanca, donde colabora en la docencia de los grados en Audiología y en Filología Hispánica. En su tesis
  doctoral estudia la producción y la percepción de las voces transfemeninas en español peninsular. En LendeLab
  investiga el papel de la ansiedad y la depresión en la modulación del habla, cuestión que abordó ya en el trabajo
  de fin de grado, dedicado a las características fonéticas del habla en la depresión mayor. Trabaja también sobre
  las redes semánticas de hablantes con enfermedad de Alzheimer. Se graduó en Filología Hispánica en la Universidad
  de Salamanca (2021) y obtuvo después, con premio extraordinario, el Máster en Enseñanza del Español como Lengua
  Extranjera (2022).
bio_en: A predoctoral researcher in the Department of Spanish Language at the Universidad de Salamanca, Emma Machado
  de Souza contributes to teaching on the degrees in Audiology and Hispanic Philology. In her doctoral thesis she
  studies the production and perception of transfeminine voices in Peninsular Spanish. Within LendeLab she investigates
  the role of anxiety and depression in the modulation of speech, a question she had already addressed in her undergraduate
  dissertation on the phonetic characteristics of speech in major depression. She also works on the semantic networks
  of speakers with Alzheimer’s disease. After graduating in Hispanic Philology from the Universidad de Salamanca
  (2021), she completed the MA in Teaching Spanish as a Foreign Language (2022), for which she was awarded the Premio Extraordinario, the university’s award for an outstanding academic record.
