bio_es: Esther Ochoa Obeso es investigadora predoctoral en la Universidad de Salamanca, adscrita al Departamento
  de Psicología Básica, Psicobiología y Metodología de las Ciencias del Comportamiento, donde ha colaborado en la
  docencia del Grado en Psicología. Se ocupa de los marcadores del discurso y, en particular, del funcionamiento
  de estas unidades en los trastornos del lenguaje. En su tesis doctoral los estudia en el habla de personas con
  enfermedad de Alzheimer. Desde la misma perspectiva pragmática firmó en 2023, con Olga Ivanova, Emma Machado de
  Souza y Soraya Méndez Sanz, un estudio sobre los retos de evaluar la competencia pragmática en las enfermedades
  neurodegenerativas. Se graduó en Filología Hispánica (2018) y obtuvo el Máster en Enseñanza del Español como Lengua
  Extranjera (2020) en la Universidad de Salamanca.
bio_en: Esther Ochoa Obeso is a predoctoral researcher at the Universidad de Salamanca, attached to the Department
  of Basic Psychology, Psychobiology and Methodology of Behavioral Sciences, where she has contributed to teaching
  on the degree in Psychology. Her work is on discourse markers, and in particular on how these units function in
  language disorders. In her doctoral thesis she studies them in the speech of people with Alzheimer’s disease.
  From the same pragmatic perspective, in 2023 she co-authored a study on the challenges of assessing pragmatic
  competence in neurodegenerative diseases with Olga Ivanova, Emma Machado de Souza and Soraya Méndez Sanz. She
  took a BA in Hispanic Philology (2018) and an MA in Teaching Spanish as a Foreign Language (2020) at the Universidad
  de Salamanca.
