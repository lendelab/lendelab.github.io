bio_es: Jordi Just Alcaraz es investigador predoctoral en el Departamento de Lengua Española de la Universidad de
  Salamanca. En su tesis doctoral, vinculada al proyecto DEMEALEN, estudia el ritmo del habla en la enfermedad de
  Alzheimer. El ritmo es también el tema del estudio que publicó en Loquens (2025), donde lo compara, junto con
  la frecuencia fundamental, en el habla de personas con enfermedad de Alzheimer y con depresión mayor. Trabaja
  además en fonética forense. Se graduó en Filología Hispánica (2024) y obtuvo el Máster en Investigación Lingüística
  (2025) en la Universidad de Salamanca.
bio_en: Jordi Just Alcaraz works as a predoctoral researcher in the Department of Spanish Language at the Universidad
  de Salamanca. His doctoral thesis, linked to the DEMEALEN project, is on speech rhythm in Alzheimer’s disease.
  Rhythm is also the topic of the study he published in Loquens (2025), which compares it, together with fundamental
  frequency, in the speech of people with Alzheimer’s disease and of people with major depression. He also works
  on forensic phonetics. He holds a BA in Hispanic Philology (2024) and an MA in Linguistic Research (2025) from
  the Universidad de Salamanca.
