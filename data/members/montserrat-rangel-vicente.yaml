bio_es: 'Montserrat Rangel Vicente es <span lang="fr">maîtresse de conférences</span> de lingüística española en
  la Université de Lille y miembro del laboratorio Savoirs, Textes, Langage (UMR 8163, CNRS). La categoría del nombre
  propio, que estudia desde la morfosemántica y la lexicología, articula la mayor parte de los trabajos que ha publicado.
  En LendeLab aplica ese interés a los topónimos: analiza mediante pruebas de fluidez verbal cómo se organizan en
  el léxico mental y si pueden servir como marcadores de la progresión de la enfermedad de Alzheimer. Se doctoró
  en Filología en la Universitat de Barcelona (2017).'
bio_en: 'Montserrat Rangel Vicente is <span lang="fr">maîtresse de conférences</span> in Spanish linguistics at
  the Université de Lille and a member of the Savoirs, Textes, Langage laboratory (UMR 8163, CNRS). Most of her
  published work is organized around the category of the proper name, which she approaches from morphosemantics
  and lexicology. At LendeLab she applies that interest to toponyms: through verbal fluency tests she analyzes how
  they are organized in the mental lexicon and whether they can serve as markers of the progression of Alzheimer’s
  disease. She holds a PhD in Philology from the Universitat de Barcelona (2017).'
