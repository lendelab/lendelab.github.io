bio_es: Olga Ivanova es profesora titular de Lingüística General en la Universidad de Salamanca y dirige LendeLab
  desde 2024. Investiga los cambios del lenguaje en el envejecimiento y los distingue de los trastornos lingüísticos
  propios de la enfermedad de Alzheimer, en busca de rasgos que sirvan como biomarcadores del deterioro cognitivo.
  De ese trabajo procede el Corpus Quijote, que reúne muestras de habla de 361 personas mayores con y sin deterioro
  cognitivo y está disponible en DementiaBank. Dirige también el proyecto FONEMA (Becas Leonardo de la Fundación
  BBVA, 2025-2027), que elabora un corpus de biomarcadores fonéticos en español. Se doctoró en Filología Hispánica
  en la Universidad de Salamanca (2011) y cursó después el Máster en Neurociencia de la Audición y el Lenguaje del
  Instituto de Neurociencias de Castilla y León, con cuyo grupo Neurofisiología, Cognición y Conducta colabora.
bio_en: 'Olga Ivanova is an associate professor of General Linguistics at the Universidad de Salamanca and has directed
  LendeLab since 2024. She studies the changes that language undergoes in aging and distinguishes them from the
  language disorders specific to Alzheimer’s disease, in search of features that can serve as biomarkers of cognitive
  decline. The Corpus Quijote came out of that work: it holds speech samples from 361 older adults with and without
  cognitive impairment and is available in DementiaBank. She also leads the FONEMA project (Becas Leonardo of the
  Fundación BBVA, 2025–2027), which is building a corpus of phonetic biomarkers in Spanish. She received her PhD
  in Hispanic Philology from the Universidad de Salamanca in 2011 and later took the Master’s in the Neuroscience
  of Hearing and Language at the Instituto de Neurociencias de Castilla y León, whose Neurofisiología, Cognición
  y Conducta group she collaborates with.'
