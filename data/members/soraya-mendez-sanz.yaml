bio_es: Soraya Méndez Sanz es investigadora predoctoral en la Universidad de Salamanca y profesora asociada en la
  Facultad de Ciencias de la Salud de la Universidad Pontificia de Salamanca, donde enseña en el Grado en Logopedia.
  En su tesis doctoral estudia la competencia pragmática de las personas con enfermedad de Alzheimer como posible
  indicador del deterioro cognitivo. Para medir esa competencia ha revisado los instrumentos de evaluación pragmática
  disponibles con vistas a adaptarlos a la población con demencia. Es graduada en Estudios Franceses y en Logopedia.
bio_en: Soraya Méndez Sanz combines predoctoral research at the Universidad de Salamanca with a post as associate
  lecturer in the Faculty of Health Sciences of the Universidad Pontificia de Salamanca, where she teaches on the
  degree in Speech-Language Pathology. Her doctoral research addresses the pragmatic competence of people with Alzheimer’s
  disease as a possible indicator of cognitive decline. To measure that competence, she has reviewed the available
  instruments for pragmatic assessment with a view to adapting them for people with dementia. She holds degrees
  in French Studies and in Speech-Language Pathology.
