text_es: Destaca que la de FONEMA fue la única beca de lingüística entre las siete concedidas en el área de Humanidades
  y que el atlas del proyecto será interactivo y de acceso abierto.
text_en: The report points out that FONEMA’s was the only linguistics grant among the seven awarded in the Humanities
  area, and that the project’s atlas will be interactive and open access.
