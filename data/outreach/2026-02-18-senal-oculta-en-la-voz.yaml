text_es: Explicación para el público general de cómo el habla de las personas mayores puede ayudar a distinguir
  la enfermedad de Alzheimer de la depresión mayor, a partir de un estudio de los autores publicado en la revista
  *Loquens*.
text_en: An explanation for the general public of how the speech of older people can help to tell Alzheimer’s disease
  apart from major depression, based on a study by the authors published in the journal *Loquens*.
