summary_es: Con este proyecto se diseñó un corpus electrónico semiabierto del lenguaje oral de personas mayores
  con deterioro cognitivo, concebido para estudiar a lo largo del tiempo las alteraciones lingüísticas en los distintos
  grados de deterioro, del más leve al más grave. El resultado fue un protocolo de creación del corpus que fija
  los parámetros de análisis y el sistema de codificación.
summary_en: This project designed a semi-open electronic corpus of the spoken language of older adults with cognitive
  impairment, intended for studying linguistic changes over time across the different degrees of impairment, from
  the mildest to the most severe. Its outcome was a protocol for building the corpus that sets out the parameters
  of analysis and the coding system.
