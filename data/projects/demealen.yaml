summary_es: DEMEALEN analizó el habla emocional para distinguir la depresión mayor de la sintomatología depresiva
  de la fase preclínica de la enfermedad de Alzheimer. En el marco del proyecto se compararon el ritmo y la frecuencia
  fundamental del habla en los dos cuadros. A él está vinculada una tesis doctoral sobre el ritmo del habla en la
  enfermedad de Alzheimer.
summary_en: DEMEALEN analyzed emotional speech in order to distinguish major depression from the depressive symptoms
  of the preclinical phase of Alzheimer’s disease. Within the project, the rhythm and fundamental frequency of speech
  were compared across the two conditions. A doctoral thesis on speech rhythm in Alzheimer’s disease is linked to
  it.
