summary_es: El discurso público en español sobre las enfermedades neurodegenerativas, en particular sobre la demencia,
  se estudió en este proyecto con métodos del análisis del discurso, la sociolingüística y la lingüística clínica.
  Como resultado se reunió un banco de datos del paisaje lingüístico sobre la demencia en español.
summary_en: This project studied public discourse in Spanish on neurodegenerative diseases, and on dementia in particular,
  with methods from discourse analysis, sociolinguistics and clinical linguistics. Its result was a database of
  the linguistic landscape of dementia in Spanish.
