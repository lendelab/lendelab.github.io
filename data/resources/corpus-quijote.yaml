slug: corpus-quijote
title_es: Corpus Quijote
title_en: Corpus Quijote
text_es: 'El Corpus Quijote reúne muestras de lectura estandarizada: 361 hablantes nativos de español peninsular
  leyeron en voz alta el mismo texto, el primer párrafo del *Quijote*, en las mismas condiciones de grabación. De
  ellos, 197 no presentaban deterioro cognitivo, 90 tenían deterioro cognitivo leve y 74, enfermedad de Alzheimer.
  Las grabaciones se hicieron en la Universidad de Salamanca, cuyo Comité de Bioética aprobó el protocolo. El diseño
  del corpus se describe en el artículo de referencia que figura más abajo; las normas de TalkBank exigen citarlo
  en cualquier uso de los datos.'
text_en: 'The Corpus Quijote is a collection of standardized reading samples: 361 native speakers of Peninsular
  Spanish read the same text aloud, the first paragraph of the *Quijote*, under the same recording conditions. Of
  these speakers, 197 had no cognitive impairment, 90 had mild cognitive impairment and 74 had Alzheimer’s disease.
  The recordings were made at the Universidad de Salamanca, whose Bioethics Committee approved
  the protocol. The design of the corpus is described in the reference article given below, which TalkBank’s rules
  require to be cited whenever the data are used.'
