slug: fonema
title_es: Corpus y atlas FONEMA (en preparación)
title_en: FONEMA corpus and atlas (in preparation)
text_es: FONEMA prepara para el español un corpus de muestras de habla anotadas de personas con enfermedad de Alzheimer,
  enfermedad de Parkinson, demencia frontotemporal y demencia con cuerpos de Lewy. Lo acompañará un atlas interactivo
  que mostrará, para cada enfermedad, el perfil lingüístico y del habla junto con las alteraciones de los rasgos
  fónicos asociadas a ella. Ambos recursos se publicarán en acceso abierto en <https://fonema.usal.es/>; la consulta
  está prevista para enero de 2027.
text_en: FONEMA is preparing a corpus of annotated speech samples in Spanish from people with Alzheimer’s disease,
  Parkinson’s disease, frontotemporal dementia and dementia with Lewy bodies. It will be accompanied by an interactive
  atlas showing, for each disease, the language and speech profile together with the changes in sound features associated
  with it. Both resources will be published open access at https://fonema.usal.es/ and are expected to be available
  in January 2027.
