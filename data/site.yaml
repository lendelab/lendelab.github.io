group:
  lede_es: LendeLab (Lenguaje en neurodegeneración) es un grupo de investigación de la Universidad de Salamanca,
    vector de la Unidad de Investigación Consolidada LinGAP, dirigido desde 2024 por Olga Ivanova. Estudia los cambios
    del lenguaje y del habla en el envejecimiento y en las enfermedades neurodegenerativas, en particular en la
    enfermedad de Alzheimer.
  lede_en: LendeLab, short for Lenguaje en neurodegeneración (Language in Neurodegeneration), is a research group at the Universidad
    de Salamanca and a vector of LinGAP, a Consolidated Research Unit; Olga
    Ivanova has directed it since 2024. The group studies how language and speech change in aging and in neurodegenerative
    diseases, Alzheimer’s disease in particular.
  body_es:
  - Se ocupa sobre todo de los rasgos lingüísticos que pueden funcionar como marcadores del deterioro cognitivo.
    Las investigaciones del grupo abarcan la fonética y la prosodia, la sintaxis, la pragmática y el léxico. Se
    apoyan en corpus orales de personas mayores con y sin deterioro cognitivo, entre ellos el Corpus Quijote (disponible
    en DementiaBank) y el corpus de biomarcadores fonéticos en español que elabora el proyecto FONEMA.
  - Como vector de LinGAP, LendeLab coordina la colaboración con instituciones que trabajan con hablantes con trastornos
    del lenguaje y gestiona la investigación de la unidad en lingüística clínica.
  body_en:
  - It is concerned above all with the linguistic features that can act as markers of cognitive decline. The group’s
    research covers phonetics and prosody, syntax, pragmatics and the lexicon. It draws on spoken corpora of older
    adults with and without cognitive impairment, among them the Corpus Quijote (available in DementiaBank) and
    the corpus of phonetic biomarkers in Spanish that the FONEMA project is compiling.
  - As a vector of LinGAP, LendeLab coordinates collaboration with institutions that work with speakers who have
    language disorders, and it manages the unit’s research in clinical linguistics.
